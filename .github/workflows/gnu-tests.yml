name: GNU Coreutils Online Test Suite Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_utility:
        description: 'Utility to test (e.g. cat, echo, ls, or "all")'
        required: false
        default: 'all'

env:
  CARGO_TERM_COLOR: always

jobs:
  gnu-test-runner:
    name: Run GNU Coreutils Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build & Testing Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autopoint bison gettext gperf texinfo rsync python3 autoconf automake libcap-dev gawk build-essential

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Coreutils Binaries (Release)
        run: cargo build --release

      - name: Execute GNU Coreutils Test Suite
        run: |
          chmod +x tests/gnu/run_gnu_tests.sh
          chmod +x tests/gnu/test_runner.py
          bash tests/gnu/run_gnu_tests.sh

      - name: Report GNU Test Suite Summary
        if: always()
        run: |
          python3 tests/gnu/test_runner.py

      - name: Upload Complete Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnu-test-suite-logs
          path: |
            tests/gnu/coreutils-src/tests/test-suite.log
            tests/gnu/coreutils-src/tests/**/*.log
          if-no-files-found: ignore
