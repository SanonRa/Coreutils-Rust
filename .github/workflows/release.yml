name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --release

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            if [ -n "$INPUT_VER" ]; then
              TAG_NAME="$INPUT_VER"
            else
              TAG_NAME="v0.1.0-dev-${{ github.run_number }}"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME" || true
            git push origin "$TAG_NAME" || true
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Package Executables
        run: |
          mkdir -p dist
          for file in target/release/*; do
            if [ -f "$file" ] && [ -x "$file" ] && [[ "$file" != *.* ]]; then
              cp "$file" dist/
            fi
          done
          cd dist
          zip -r ../coreutils-rust-linux-x86_64.zip .
          cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" coreutils-rust-linux-x86_64.zip \
            --title "Coreutils Rust $TAG_NAME" \
            --notes "Automatic release of coreutils-rust binaries ($TAG_NAME)." \
            || gh release upload "$TAG_NAME" coreutils-rust-linux-x86_64.zip --clobber
